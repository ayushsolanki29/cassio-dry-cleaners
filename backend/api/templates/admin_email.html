<div style="font-family: 'Inter', Arial, sans-serif; font-size: 13px; color: #334155; line-height: 1.5; max-width: 600px;">
    <h3 style="margin-top: 0; color: #0f172a; border-bottom: 2px solid #4f46e5; padding-bottom: 8px;">New Contact Inquiry</h3>
    <table cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%; text-align: left; border: 1px solid #e2e8f0;">
        <tr style="border-bottom: 1px solid #e2e8f0;">
            <th style="background-color: #f8fafc; color: #475569; width: 120px; font-weight: 600;">Name</th>
            <td style="color: #0f172a; font-weight: 500;">{{name}}</td>
        </tr>
        <tr style="border-bottom: 1px solid #e2e8f0;">
            <th style="background-color: #f8fafc; color: #475569; font-weight: 600;">Email</th>
            <td><a href="mailto:{{email}}" style="color: #4f46e5; text-decoration: none; font-weight: 500;">{{email}}</a></td>
        </tr>
        <tr style="border-bottom: 1px solid #e2e8f0;">
            <th style="background-color: #f8fafc; color: #475569; font-weight: 600;">Phone</th>
            <td style="color: #0f172a; font-weight: 500;">{{phone}}</td>
        </tr>
        <tr style="border-bottom: 1px solid #e2e8f0;">
            <th style="background-color: #f8fafc; color: #475569; font-weight: 600;">Service</th>
            <td><span style="background-color: #e0e7ff; color: #4f46e5; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">{{service}}</span></td>
        </tr>
        <tr>
            <th style="background-color: #f8fafc; color: #475569; vertical-align: top; font-weight: 600;">Message</th>
            <td style="color: #334155; font-style: italic;">"{{{message}}}"</td>
        </tr>
    </table>
</div>
